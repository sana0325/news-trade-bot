name: Build ndscan APK

on:
  push:
    paths: ["ndscan-android/**", ".github/workflows/build-ndscan-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ndscan-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy потрібен Python тієї ж версії, що й у застосунку (3.11), щоб поставити requests.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ndscan.apk
          zip -j ndscan.zip ndscan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ndscan-debug-apk
          path: ndscan-android/ndscan.apk

      # Постійні посилання на пряме завантаження:
      # https://github.com/<owner>/<repo>/releases/download/ndscan-latest/ndscan.apk (і ndscan.zip)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ndscan-latest
          name: ndscan (остання збірка)
          prerelease: true
          files: |
            ndscan-android/ndscan.apk
            ndscan-android/ndscan.zip
          overwrite_files: true
