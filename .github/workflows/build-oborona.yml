name: Build Oborona APK

on:
  push:
    branches: [main, "claude/**"]
    paths: ["oborona/**", ".github/workflows/build-oborona.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  RELEASE_TAG: oborona-latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Install Godot and export templates
        run: |
          V=$GODOT_VERSION
          wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_export_templates.tpz
          unzip -q Godot_v$V-stable_linux.x86_64.zip
          sudo mv Godot_v$V-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/$V.stable
          unzip -q Godot_v$V-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/$V.stable/

      - name: Configure Android export (SDK, JDK, debug keystore)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-$GODOT_VERSION.tres; do
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
            sed -i 's/^          //' ~/.config/godot/$f
          done

      - name: Import and smoke test
        working-directory: oborona
        run: |
          godot --headless --path . --import || true
          timeout 300 godot --headless --path . -s res://tests/SmokeTest.gd 2>&1 | grep -E "OK|FAIL|ПОМИЛОК"

      - name: Export APK
        working-directory: oborona
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Oborona.apk
          ls -la build/Oborona.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oborona-apk
          path: oborona/build/Oborona.apk

      - name: Publish to release (permanent download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $RELEASE_TAG >/dev/null 2>&1 || \
            gh release create $RELEASE_TAG --title "Оборона міста — остання збірка" \
              --notes "Автоматична debug-збірка для Android (arm64)." --prerelease --target ${{ github.sha }}
          gh release upload $RELEASE_TAG oborona/build/Oborona.apk --clobber
